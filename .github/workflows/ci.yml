name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 是声明的最低版本（`fromisoformat` 吃 `Z`、`tomllib`，都从 3.11 起）
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # 门禁只有这两条，与 README 的「开发」一节保持一致。
      # 刻意**不**把 `mypy` 放进门禁：它还有 41 项未清零（见实现记录 §18.5 / §19.4），
      # 放进来只会让 CI 常年红着被人忽略——那比不检查更坏。
      - name: 静态检查（ruff）
        run: ruff check .

      - name: 测试（pytest）
        run: pytest -q --basetemp="${{ runner.temp }}/aspirit"
